name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}      # lets you run manually if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep service awake
        run: |
          curl -sSf https://hisabkar-server.onrender.com/health || true
